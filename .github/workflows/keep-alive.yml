name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'  # Cada 3 días a las 8:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase Demo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/vehiculos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo "Ping completado"

      - name: Ping Supabase Demo (INSERT)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/eventos_catalogo" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"tipo": "visita_catalogo"}')
          echo "INSERT eventos_catalogo -> HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::INSERT en eventos_catalogo devolvió $HTTP_CODE (se esperaba 201)"
            exit 1
          fi

      - name: Update last-ping timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-ping.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping $(date -u +%Y-%m-%d)"
          git push
